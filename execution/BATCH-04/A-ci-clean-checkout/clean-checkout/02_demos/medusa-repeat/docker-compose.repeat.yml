name: crossborder-medusa-repeat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_local_dev
      POSTGRES_DB: medusa_dtc
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_dtc"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
