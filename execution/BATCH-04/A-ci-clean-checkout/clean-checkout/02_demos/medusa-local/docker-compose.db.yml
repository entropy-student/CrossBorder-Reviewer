services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_local_dev
      POSTGRES_DB: medusa_dtc
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - medusa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_dtc"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  medusa_pgdata:
